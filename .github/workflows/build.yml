name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Clean and Recreate Android folder
      run: |
        rm -rf android
        flutter create . --platforms=android

    # --- PATCH ANDROID MANIFEST (Ubah Nama & Izin) ---
    - name: Patch AndroidManifest (Name & Permissions)
      run: |
        # Ubah nama aplikasi jadi Google
        sed -i 's/android:label="dadu_google"/android:label="Google"/g' android/app/src/main/AndroidManifest.xml
        # Nambahin izin internet
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        # Nambahin configChanges biar Activity gak di-restart (Anti-Refresh)
        sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"\n            android:launchMode="singleTop"/' android/app/src/main/AndroidManifest.xml

    # --- GANTI LOGO JADI GOOGLE ---
    - name: Change App Icon to Google
      run: |
        wget -q "https://raw.githubusercontent.com/devicons/devicon/master/icons/google/google-original.png" -O google_icon.png
        cp google_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

    - name: Build APK
      run: flutter build apk --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
