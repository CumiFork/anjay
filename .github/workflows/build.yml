name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Clean and Recreate Android folder
      run: |
        rm -rf android pubspec.lock
        flutter create . --platforms=android
        flutter pub get

    - name: Patch AndroidManifest (Label, Internet, Cleartext, Anti Refresh)
      run: |
        python3 - << 'EOF'
        import re

        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()

        # Ganti nama aplikasi menjadi Google
        content = re.sub(r'android:label="[^"]*"', 'android:label="Google"', content)

        # Tambah permission Internet & Network State
        if 'android.permission.INTERNET' not in content:
            content = re.sub(
                r'(<manifest[^>]*>)',
                r'\1\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
                content,
                count=1
            )

        # Izinkan Cleartext Traffic (HTTP API Berita)
        if 'android:usesCleartextTraffic' not in content:
            content = content.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

        # Anti-reload saat rotasi/keyboard muncul
        if 'android:configChanges' not in content:
            content = content.replace(
                '<activity',
                '<activity android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:launchMode="singleTop"',
                1
            )

        with open(path, 'w') as f:
            f.write(content)
        EOF

    - name: Patch Gradle (Memory, MinSdk 23, Proguard)
      run: |
        echo "org.gradle.jvmargs=-Xmx4096M" >> android/gradle.properties
        echo "-keep class com.pichillilorenzo.flutter_inappwebview.** { *; }" > android/app/proguard-rules.pro

        python3 - << 'EOF'
        import re

        path = 'android/app/build.gradle'
        with open(path, 'r') as f:
            gradle = f.read()

        # Paksa minSdk ke 23 (mendukung format minSdk = ... maupun minSdkVersion ...)
        gradle = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', gradle)

        # Aktifkan proguard-rules.pro di blok release
        if 'proguard-rules.pro' not in gradle:
            gradle = gradle.replace(
                'signingConfig = signingConfigs.getByName("debug")',
                'signingConfig = signingConfigs.getByName("debug")\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"'
            )

        with open(path, 'w') as f:
            f.write(gradle)
        EOF

    - name: Change App Icon to Google
      run: |
        curl -fSL -A "Mozilla/5.0" "https://github.com/Google.png" -o google_icon.png
        # Hapus adaptive icon bawaan Flutter agar ic_launcher.png terbaca di Android 8+
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        for dir in mipmap-xxxhdpi mipmap-xxhdpi mipmap-xhdpi mipmap-hdpi mipmap-mdpi; do
          mkdir -p android/app/src/main/res/$dir
          cp google_icon.png android/app/src/main/res/$dir/ic_launcher.png
        done

    - name: Build APK
      run: flutter build apk --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
