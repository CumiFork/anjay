name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    # Hapus file lock lama biar bisa download library baru
    - name: Clean dependencies
      run: rm -f pubspec.lock

    - name: Get dependencies
      run: flutter pub get

    - name: Clean and Recreate Android folder
      run: |
        rm -rf android
        flutter create . --platforms=android

    - name: Patch AndroidManifest (Name, Permissions & Launch Mode)
      run: |
        python3 -c "
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()
        content = content.replace('android:label=\"dadu_google\"', 'android:label=\"Google\"')
        if 'android.permission.INTERNET' not in content:
            content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application', 1)
        if 'android:configChanges' not in content:
            content = content.replace('<activity', '<activity android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode\" android:launchMode=\"singleTop\"', 1)
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: Change App Icon to Google
      run: |
        wget -q --user-agent="Mozilla/5.0" "https://github.com/Google.png" -O google_icon.png
        cp google_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

    - name: Build APK
      run: flutter build apk --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
