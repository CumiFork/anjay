name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Clean and Recreate Android folder
      run: |
        rm -rf android
        flutter create . --platforms=android

    # --- PATCH MANIFEST PAKE PYTHON (ANTI RUSAK) ---
    - name: Patch AndroidManifest
      run: |
        python3 -c "
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()
        
        # 1. Tambah izin internet
        if 'android.permission.INTERNET' not in content:
            content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application', 1)
            
        # 2. Tambah configChanges & launchMode di activity (Anti Refresh)
        if 'android:configChanges' not in content:
            content = content.replace('<activity', '<activity android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode\" android:launchMode=\"singleTop\"', 1)
            
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: Build APK
      run: flutter build apk --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
