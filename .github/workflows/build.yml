name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Clean dependencies
      run: rm -f pubspec.lock

    - name: Get dependencies
      run: flutter pub get

    - name: Clean and Recreate Android folder
      run: |
        rm -rf android
        flutter create . --platforms=android

    - name: Patch AndroidManifest (Internet, Cleartext, Anti Refresh, Label)
      run: |
        python3 -c "
        import re
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()
        
        # FIX 1: Regex buat ganti nama app jadi 'Google' mau apapun nama projectnya
        content = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"Google\"', content)
        
        if 'android.permission.INTERNET' not in content:
            match = re.search(r'(<manifest[^>]*>)', content)
            if match:
                content = content.replace(match.group(1), match.group(1) + '\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n', 1)

        if 'android:usesCleartextTraffic' not in content:
            content = content.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1)

        if 'android:configChanges' not in content:
            content = content.replace('<activity', '<activity android:configChanges=\"orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode\" android:launchMode=\"singleTop\"', 1)
        
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: Patch Gradle Memory (Anti OOM)
      run: |
        echo "org.gradle.jvmargs=-Xmx4096M" >> android/gradle.properties

    - name: Change App Icon to Google
      run: |
        wget -q --user-agent="Mozilla/5.0" "https://github.com/Google.png" -O google_icon.png
        # Bikin direktori mipmap kalau belum ada (kadang flutter create ga bikin semua)
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        # Copy icon
        cp google_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp google_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png

    - name: Build APK
      run: flutter build apk --release

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: build/app/outputs/flutter-apk/app-release.apk
